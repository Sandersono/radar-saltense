name: "Manutenção: população (IBGE)"
# Compara a população de Salto em src/config.js com a estimativa mais nova do IBGE.
# Todo dia 5, às 12:00 UTC (09:00 em Brasília).
# Roda separado do robô diário (atualizar.yml): não mexe no site nem nos dados, só abre, comenta ou fecha
# o issue com o rótulo "manutencao-populacao". Ver OPERACAO.md, seção 11.

on:
  schedule:
    - cron: '0 12 5 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DONO: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node src/manutencao/populacao.js
      - name: A própria verificação falhou
        if: failure()
        run: |
          gh label create manutencao-populacao --color FBCA04 --description "Verificação de manutenção: populacao" --force >/dev/null || true
          gh issue create --label manutencao-populacao \
            --title "Manutenção, população (IBGE): a verificação falhou ($(TZ=America/Sao_Paulo date +%d/%m/%Y))" \
            --body "A verificação de manutenção \"populacao\" não conseguiu terminar. Veja o log em ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} e a seção 11 do OPERACAO.md. @${{ github.repository_owner }}"
