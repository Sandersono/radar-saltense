name: Atualizar Radar Saltense

on:
  schedule:
    - cron: '0 6 * * *' # 03:00 em Brasília
  workflow_dispatch:
    inputs:
      so_publicar:
        description: Só publicar os dados já salvos no repositório (plano B)
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-saltense
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run checar
      - name: Coletar, conferir e gerar
        if: ${{ !inputs.so_publicar }}
        run: npm run atualizar
      - name: Gerar o site com os dados já salvos
        if: ${{ inputs.so_publicar }}
        run: npm run gerar
      - name: Guardar relatório de conferência
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conferencia
          path: conferencia.md
          if-no-files-found: ignore
      - name: Salvar dados no repositório
        if: ${{ !inputs.so_publicar }}
        run: |
          git config user.name "radar-saltense-robo"
          git config user.email "radar-saltense-robo@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "dados: atualização diária"
          git pull --rebase origin ${{ github.ref_name }}
          git push
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: publicar
        uses: actions/deploy-pages@v5
