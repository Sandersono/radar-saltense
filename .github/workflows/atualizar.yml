name: Atualizar Radar Saltense
# Nome de cada execução: separa a atualização completa do "só publicar" (a verificação de "já rodou hoje" usa isso).
run-name: ${{ inputs.so_publicar && 'Só publicar Radar Saltense' || 'Atualizar Radar Saltense' }}

on:
  schedule:
    - cron: '0 6 * * *' # 03:00 em Brasília
    - cron: '0 14 * * *' # 11:00 em Brasília: reserva, se o GitHub pular ou atrasar a das 03:00
  workflow_dispatch:
    inputs:
      so_publicar:
        description: Só publicar os dados já salvos no repositório (plano B)
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: radar-saltense
  cancel-in-progress: false

jobs:
  # Execução agendada do GitHub só roda se ainda não houve uma atualização completa com sucesso hoje (em Brasília),
  # seja a do despertador da VPS (03:00, disparo manual), seja uma agendada. Assim nada roda duas vezes no dia.
  hoje:
    runs-on: ubuntu-latest
    outputs:
      pular: ${{ steps.ver.outputs.pular }}
    steps:
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pular=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            hoje=$(TZ=America/Sao_Paulo date +%F)
            feitas=$(gh run list --repo "${{ github.repository }}" --workflow atualizar.yml --status success --limit 20 --json createdAt,displayTitle -q '.[] | select(.displayTitle == "Atualizar Radar Saltense") | .createdAt' \
              | while read -r d; do TZ=America/Sao_Paulo date -d "$d" +%F; done | grep -c "^$hoje$" || true)
            [ "$feitas" -gt 0 ] && pular=true
            echo "Hoje: $hoje. Atualizações completas com sucesso hoje: $feitas. Pular: $pular."
          fi
          echo "pular=$pular" >> "$GITHUB_OUTPUT"
  atualizar:
    needs: hoje
    if: needs.hoje.outputs.pular != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run checar
      - name: Coletar, conferir e gerar
        if: ${{ !inputs.so_publicar }}
        run: npm run atualizar
      - name: Gerar o site com os dados já salvos
        if: ${{ inputs.so_publicar }}
        run: npm run gerar
      - name: Guardar relatório de conferência
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conferencia
          path: conferencia.md
          if-no-files-found: ignore
      - name: Salvar dados no repositório
        if: ${{ !inputs.so_publicar }}
        run: |
          git config user.name "radar-saltense-robo"
          git config user.email "radar-saltense-robo@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "dados: atualização diária"
          git pull --rebase origin ${{ github.ref_name }}
          git push
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: publicar
        uses: actions/deploy-pages@v5
